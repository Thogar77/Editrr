<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editrr — Roadmap</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #222534;
      --border: #2e3347;
      --accent: #7c6af7;
      --accent2: #4ecdc4;
      --done: #3ecf8e;
      --warn: #f7c948;
      --text: #e2e4f0;
      --muted: #6b7280;
      --hint-bg: #1e2235;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
    }

    header span {
      font-size: 13px;
      color: var(--muted);
    }

    .global-progress {
      padding: 20px 24px 4px;
      max-width: 860px;
      margin: 0 auto;
    }

    .global-progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .global-progress-label strong {
      color: var(--done);
      font-size: 15px;
    }

    .bar-track {
      background: var(--border);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.4s ease;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 24px 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .category {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      background: var(--surface2);
    }

    .category-header:hover { background: #272a3d; }

    .category-header .icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .category-header .cat-title {
      font-weight: 600;
      font-size: 15px;
      flex: 1;
    }

    .cat-progress {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .cat-percent {
      font-weight: 700;
      margin-left: 6px;
    }

    .mini-bar {
      width: 80px;
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-left: 10px;
    }

    .mini-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--accent);
      transition: width 0.4s ease;
    }

    .chevron {
      color: var(--muted);
      font-size: 12px;
      transition: transform 0.2s;
      margin-left: 8px;
    }

    .category.open .chevron { transform: rotate(90deg); }

    .items {
      display: none;
      flex-direction: column;
    }

    .category.open .items { display: flex; }

    .item {
      border-top: 1px solid var(--border);
      padding: 12px 18px;
    }

    .item-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .item-check {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 2px solid var(--border);
      flex-shrink: 0;
      cursor: pointer;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .item-check.checked {
      background: var(--done);
      border-color: var(--done);
    }

    .item-check.checked::after {
      content: '✓';
      color: #000;
      font-size: 11px;
      font-weight: 700;
    }

    .item-body { flex: 1; }

    .item-title {
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .item-title.checked-label {
      text-decoration: line-through;
      color: var(--muted);
    }

    .item-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .hint-toggle {
      font-size: 11px;
      color: var(--accent);
      cursor: pointer;
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      opacity: 0.8;
    }

    .hint-toggle:hover { opacity: 1; }

    .hint-box {
      display: none;
      background: var(--hint-bg);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      padding: 10px 14px;
      margin-top: 8px;
      font-size: 13px;
      color: #a9afc7;
      line-height: 1.7;
    }

    .hint-box.visible { display: block; }

    .hint-box a {
      color: var(--accent2);
      text-decoration: none;
    }
    .hint-box a:hover { text-decoration: underline; }

    .hint-box code {
      background: #2a2f48;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: monospace;
      font-size: 12px;
      color: var(--warn);
    }

    .tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .tag-hard { background: #3d1f1f; color: #f87171; }
    .tag-medium { background: #3d3010; color: #f7c948; }
    .tag-easy { background: #0f3020; color: #3ecf8e; }

    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      main { padding: 16px 12px 60px; }
      .item { padding: 10px 12px; }
      .category-header { padding: 12px 14px; }
      .mini-bar { display: none; }
    }
  </style>
</head>
<body>

<header>
  <h1>Editrr Roadmap</h1>
  <span id="header-progress">Ładowanie...</span>

  </div>
  <div class="bar-track">
    <div class="bar-fill" id="global-bar" style="width:0%"></div>
  </div>
</div>

<main id="app"></main>

  },
  {

// ─── Stan ─────────────────────────────────────────────────────────────────────

const STORAGE_KEY = 'editrr_roadmap_v1';

function loadState() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch { return {}; }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();

// Ustaw domyślny stan (done=true) dla pozycji oznaczonych jako zaimplementowane
ROADMAP.forEach(cat => {
  cat.items.forEach(item => {
    if (!(item.id in state) && item.done) {
      state[item.id] = true;
    }
  });
});
saveState(state);

// ─── Helpers ──────────────────────────────────────────────────────────────────

function calcProgress() {
  let total = 0, done = 0;
  ROADMAP.forEach(cat => {
    cat.items.forEach(item => {
      total++;
      if (state[item.id]) done++;
    });
  });
  return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
}

function calcCatProgress(cat) {
  let total = cat.items.length, done = 0;
  cat.items.forEach(item => { if (state[item.id]) done++; });
  return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
}

// ─── Render ───────────────────────────────────────────────────────────────────

function difficultyTag(d) {
  const map = { easy: ['easy','Łatwe'], medium: ['medium','Średnie'], hard: ['hard','Trudne'] };
  const [cls, label] = map[d] || ['easy',''];
  return `<span class="tag tag-${cls}">${label}</span>`;
}

function renderItem(item) {
  const checked = !!state[item.id];
  return `
    <div class="item" id="item-${item.id}">
      <div class="item-row">
        <div class="item-check ${checked ? 'checked' : ''}"
             onclick="toggleItem('${item.id}')"
             title="Oznacz jako zrobione"></div>
        <div class="item-body">
          <div class="item-title ${checked ? 'checked-label' : ''}" onclick="toggleItem('${item.id}')">
            ${item.title}${difficultyTag(item.difficulty)}
          </div>
          ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
          ${item.hint ? `
            <span class="hint-toggle" onclick="toggleHint('${item.id}')">
              💡 Pokaż podpowiedź
            </span>
            <div class="hint-box" id="hint-${item.id}">${item.hint}</div>
          ` : ''}
        </div>
      </div>
    </div>`;
}

function renderCategory(cat) {
  const prog = calcCatProgress(cat);
  const isOpen = cat.id === 'gap_buffer' || cat.id === 'ui'; // domyślnie otwarte
  return `
    <div class="category ${isOpen ? 'open' : ''}" id="cat-${cat.id}">
      <div class="category-header" onclick="toggleCat('${cat.id}')">
        <span class="icon">${cat.icon}</span>
        <span class="cat-title">${cat.title}</span>
        <span class="cat-progress">
          <span id="cat-done-${cat.id}">${prog.done}</span>/${prog.total}
          <span class="cat-percent" id="cat-pct-${cat.id}">${prog.pct}%</span>
          <span class="mini-bar">
            <span class="mini-bar-fill" id="cat-bar-${cat.id}" style="width:${prog.pct}%"></span>
          </span>
        </span>
        <span class="chevron">▶</span>
      </div>
      <div class="items">
        ${cat.items.map(renderItem).join('')}
      </div>
    </div>`;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = ROADMAP.map(renderCategory).join('');
  updateGlobal();
}

function updateGlobal() {
  const { total, done, pct } = calcProgress();
  document.getElementById('global-percent').textContent = pct + '%';
  document.getElementById('global-bar').style.width = pct + '%';
  document.getElementById('header-progress').textContent = `${done} / ${total} ukończone`;
}

function updateCategory(catId) {
  const cat = ROADMAP.find(c => c.id === catId);
  if (!cat) return;
  const prog = calcCatProgress(cat);
  document.getElementById(`cat-done-${catId}`).textContent = prog.done;
  document.getElementById(`cat-pct-${catId}`).textContent = prog.pct + '%';
  document.getElementById(`cat-bar-${catId}`).style.width = prog.pct + '%';
}

// ─── Akcje ────────────────────────────────────────────────────────────────────

function toggleItem(id) {
  state[id] = !state[id];
  saveState(state);

  const check = document.querySelector(`#item-${id} .item-check`);
  const label = document.querySelector(`#item-${id} .item-title`);
  check.classList.toggle('checked', !!state[id]);
  label.classList.toggle('checked-label', !!state[id]);

  const catId = ROADMAP.find(c => c.items.some(i => i.id === id))?.id;
  if (catId) updateCategory(catId);
  updateGlobal();
}

function toggleHint(id) {
  const box = document.getElementById(`hint-${id}`);
  const toggle = box.previousElementSibling;
  const visible = box.classList.toggle('visible');
  toggle.textContent = visible ? '🔼 Ukryj podpowiedź' : '💡 Pokaż podpowiedź';
}

function toggleCat(id) {
  const el = document.getElementById(`cat-${id}`);
  el.classList.toggle('open');
}

// ─── Init ─────────────────────────────────────────────────────────────────────
render();
</script>
